# Supabase local project config — `supabase start` reads this file.
project_id = "bnb"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "bnb://**", "exp://**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false

# Branded auth emails (replace Supabase's unbranded defaults). Same markup as the
# @bnb/emails magic-link/reset/confirm templates, with Supabase {{ .Var }} placeholders.
[auth.email.template.magic_link]
subject = "Your Ryo sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Reset your Ryo password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "Confirm your email for Ryo"
content_path = "./supabase/templates/confirmation.html"

# Production note: the auth emails above still ride Supabase's shared, rate-limited
# SMTP (~a few/hour) until a real sender is configured. Set a custom SMTP provider in
# the Supabase dashboard (Auth → SMTP) before launch, or magic-link sign-in will throttle.

[edge_runtime]
enabled = true
